<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        header {
            background: #333;
            color: #fff;
            padding: 15px;
        }

        nav a {
            color: #fff;
            margin-right: 20px;
            text-decoration: none;
            font-size: 16px;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        .orders-container {
            width: 90%;
            max-width: 1000px;
            margin: 25px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        .order-card {
            padding: 15px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fafafa;
        }

        .order-card h3 {
            margin: 0;
        }

        .order-items {
            margin-top: 10px;
            padding-left: 20px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            font-size: 18px;
            color: #777;
        }
    </style>
</head>

<body>

    <!-- HEADER (copy already added before in your other pages) -->
    <header>
        <nav>
            <a href="/index.html">Home</a>
            <a href="/cart.html">Cart</a>
            <a href="/checkout.html">Checkout</a>
            <a href="/orders.html">Orders</a>
        </nav>
    </header>

    <h1>Your Orders</h1>

    <div class="orders-container" id="ordersList">
        <p class="empty">Loading orders...</p>
    </div>

    <script>
        const apiBase = "http://127.0.0.1:8000/api";

        async function loadOrders() {
            const list = document.getElementById("ordersList");

            try {
                const response = await fetch(`${apiBase}/orders`);
                const data = await response.json();

                if (!data.length) {
                    list.innerHTML = `<p class="empty">No orders found.</p>`;
                    return;
                }

                list.innerHTML = "";

                data.forEach(order => {
                    const card = document.createElement("div");
                    card.classList.add("order-card");

                    card.innerHTML = `
                        <h3>Order #${order.id}</h3>
                        <p><strong>Date:</strong> ${order.created_at}</p>
                        <p><strong>Total:</strong> $${order.total}</p>

                        <h4>Items:</h4>
                        <ul class="order-items">
                            ${order.items.map(item => `
                                <li>${item.name} — ${item.quantity} × $${item.price}</li>
                            `).join("")}
                        </ul>
                    `;

                    list.appendChild(card);
                });

            } catch (err) {
                list.innerHTML = `<p class="empty">Error loading orders.</p>`;
                console.error(err);
            }
        }

        loadOrders();
    </script>
    <footer>
        <a href="">About us</a>
        <a href="public\contact.html"> Contact us</a>
        <p>This website is dedicated to showcasing furniture at attractive prices and of the best quality.</p>
    </footer>
</body>

</html>
