<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body>

  <!-- HEADER -->
  <header class="main-header">
    <h1 class="logo">Maracaibo Furniture</h1>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="cart.html" class="active">Cart</a>
      <a href="checkout.html">Checkout</a>
    </nav>
  </header>

  <!-- PAGE TITLE -->
  <section class="title">
    <h2>Your Cart:</h2>
  </section>

  <!-- CART ITEMS -->
  <section id="cart-container" class="checkout-form"></section>

  <!-- TOTAL + BUTTON -->
  <section class="checkout-total">
    <h3>Total: <span id="cart-total">0</span> USD</h3>
    <div class=".btn-shop">
      <a class="btn-tocheckout" href="checkout.html">Proceed to Checkout</a>
    </div>
  </section>
  <footer>
    <a class="openbtn" onclick="openNav()"> <i class="fa fa-fw fa-envelope"></i> Contact us</a> </div>
    <p> © 2025 E-comm</p>
  </footer>
  <div id="mySidenav" class="sidenav">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <p>Contact Sales</p>
    <p>If you want to report an something, or if you want to make a suggestion
      send us an e-mail:
      maracaibo@gmail.com</p>
  </div>
  <script>
    function openNav() {
      document.getElementById("mySidenav").style.width = "100%";
    }
    function closeNav() {
      document.getElementById("mySidenav").style.width = "0";
    }
  </script>
 <script>
  const cartContainer = document.getElementById("cart-container");
  const cartTotal = document.getElementById("cart-total");

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function renderCart() {
    cartContainer.innerHTML = "";
    let total = 0;

    if (cart.length === 0) {
      cartContainer.innerHTML = "<p>Your cart is empty.</p>";
      cartTotal.textContent = "0";
      return;
    }

    cart.forEach((item, index) => {
      total += item.price * item.quantity;

      cartContainer.innerHTML += `
        <div class="cart-item">
          <img src="${item.image}" alt="${item.name}" style="width:80px">
          <div>
            <h4>${item.name}</h4>
            <p>${item.price} USD</p>
            <p>Qty: ${item.quantity}</p>
            <button onclick="removeItem(${index})">Remove</button>
          </div>
        </div>
      `;
    });

    cartTotal.textContent = total;
  }

  function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
  }

  renderCart();
</script>

</body>

</html>
