<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<title>Shop | Maracaibo Furniture</title>
<meta name="description" content="Browse all furniture: sofas, beds, chairs, tables and accessories.">
</head>
<body data-page="shop">
<div id="site-header"></div>

<main>
  <section class="container page-head">
    <span class="eyebrow">Shop</span>
    <h1 id="page-title">All furniture</h1>
    <p id="page-intro">Filter by category, search by name or sort by price.</p>
  </section>
  <section class="container">
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Categories"></div>
      <div class="controls">
        <label class="sr-only" for="search">Search products</label>
        <input class="field" id="search" type="search" placeholder="Search products" autocomplete="off">
        <label class="sr-only" for="sort">Sort products</label>
        <select class="field" id="sort">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name A-Z</option>
        </select>
      </div>
    </div>
    <p class="result-count" id="count" aria-live="polite"></p>
    <div class="grid" id="grid" style="margin-bottom:72px"></div>
  </section>
</main>
<div id="site-footer"></div>
<script src="/js/shop.js"></script>
<script src="/js/products.js"></script>
</body>
</html>
